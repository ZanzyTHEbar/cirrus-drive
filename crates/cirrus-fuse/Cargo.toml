[package]
name = "cirrus-fuse"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
cirrus-account = { path = "../cirrus-account" }
cirrus-runtime = { path = "../cirrus-runtime" }
fuser = "0.18"
nix = { version = "0.31", features = ["signal"], optional = true }
rustix = { version = "1.1", features = ["fs", "process", "rand"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
fault-injection = ["dep:nix"]
