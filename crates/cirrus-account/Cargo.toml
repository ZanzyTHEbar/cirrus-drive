[package]
name = "cirrus-account"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
cirrus-discovery = { path = "../cirrus-discovery" }
cirrus-runtime = { path = "../cirrus-runtime" }
dav-xml = "0.2"
openidconnect = { version = "4", default-features = false }
oauth2 = { version = "5", default-features = false }
percent-encoding = "2"
quick-xml = "0.42"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
httparse = "1"
httpdate = "1"
nix = { version = "0.31", features = ["user"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rustix = { version = "1.1", features = ["event", "fs", "net", "process", "rand"] }
secret-service = { version = "5", features = ["rt-async-io-crypto-rust"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
url = "2"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
zeroize = { version = "1", features = ["derive"] }

[features]
fault-injection = ["rusqlite/hooks"]
